services:
  postgres:
    image: postgres:16-alpine
    container_name: orbit-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbit_chat
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
    ports:
      - "5432:5432"
    volumes:
      - orbit-chat-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit_chat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orbit-chat-postgres:
